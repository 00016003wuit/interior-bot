<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
  <title>LiveSpace AI</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #7c3aed;
      --primary-light: #a78bfa;
      --primary-dark: #5b21b6;
      --accent: #ec4899;
      --accent2: #f472b6;
      --success: #10b981;
      --warning: #f59e0b;
      --error: #ef4444;
      --bg: #09090f;
      --bg2: #0f0f1a;
      --surface: #13131f;
      --surface2: #1a1a2e;
      --surface3: #252540;
      --border: #2a2a45;
      --text: #f1f0ff;
      --text2: #a5a4c8;
      --text3: #6b6a8a;
      --radius: 16px;
      --radius-s: 10px;
      --radius-xs: 6px;
      --shadow: 0 8px 32px rgba(124, 58, 237, .15);
      --transition: .3s cubic-bezier(.4, 0, .2, 1);
    }

    html, body {
      height: 100%; width: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      line-height: 1.5;
    }

    #app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Screen transitions ──────────────── */
    .screen {
      display: none;
      flex-direction: column;
      min-height: 100vh;
      animation: fadeIn .35s ease;
      padding-bottom: env(safe-area-inset-bottom, 20px);
    }
    .screen.active { display: flex; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes shimmer { to { background-position: -200% 0; } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

    /* ── Common components ────────────────── */
    .screen-header {
      padding: 20px 20px 16px;
      text-align: center;
      background: linear-gradient(180deg, var(--bg2) 0%, transparent 100%);
    }
    .screen-header h2 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -.3px;
      margin-bottom: 6px;
    }
    .screen-header p {
      font-size: 14px;
      color: var(--text2);
    }
    .screen-body {
      flex: 1;
      padding: 0 20px 20px;
      overflow-y: auto;
    }
    .screen-footer {
      padding: 16px 20px;
      padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      background: linear-gradient(0deg, var(--bg) 60%, transparent);
      position: sticky;
      bottom: 0;
    }

    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 15px 24px;
      border: none; border-radius: var(--radius);
      font-size: 16px; font-weight: 600;
      cursor: pointer; transition: var(--transition);
      color: #fff;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      box-shadow: 0 4px 20px rgba(124, 58, 237, .3);
    }
    .btn-primary:active { transform: scale(.97); }
    .btn-primary:disabled {
      opacity: .5; cursor: not-allowed; transform: none;
    }
    .btn-secondary {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-secondary:active { background: var(--surface3); }
    .btn-ghost {
      background: transparent;
      color: var(--text2);
      font-size: 14px;
      padding: 10px;
    }
    .btn-sm {
      padding: 10px 18px;
      font-size: 14px;
      border-radius: var(--radius-s);
      width: auto;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      transition: var(--transition);
    }
    .card.selectable { cursor: pointer; }
    .card.selectable:active { transform: scale(.97); }
    .card.selected {
      border-color: var(--primary);
      background: rgba(124, 58, 237, .08);
      box-shadow: 0 0 0 1px var(--primary);
    }

    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 14px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 100px;
      font-size: 13px;
      cursor: pointer; transition: var(--transition);
      color: var(--text2);
      white-space: nowrap;
    }
    .chip:active { transform: scale(.95); }
    .chip.selected {
      background: rgba(124, 58, 237, .15);
      border-color: var(--primary);
      color: var(--primary-light);
    }

    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 10px;
      background: rgba(124, 58, 237, .12);
      border: 1px solid rgba(124, 58, 237, .25);
      border-radius: 100px;
      font-size: 11px; font-weight: 600;
      color: var(--primary-light);
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .progress-bar {
      width: 100%; height: 6px;
      background: var(--surface3);
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      border-radius: 3px;
      transition: width .5s ease;
    }

    .input-field {
      width: 100%; padding: 14px 16px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-s);
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: var(--transition);
    }
    .input-field:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(124, 58, 237, .15);
    }
    .input-field::placeholder { color: var(--text3); }
    textarea.input-field { min-height: 100px; resize: vertical; }

    .step-dots {
      display: flex; gap: 6px; justify-content: center; margin: 12px 0;
    }
</style></head><body></body></html>
