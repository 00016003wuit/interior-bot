<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
  <title>LiveSpace AI</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #7c3aed;
      --primary-light: #a78bfa;
      --primary-dark: #5b21b6;
      --accent: #ec4899;
      --accent2: #f472b6;
      --success: #10b981;
      --warning: #f59e0b;
      --error: #ef4444;
      --bg: #09090f;
      --bg2: #0f0f1a;
      --surface: #13131f;
      --surface2: #1a1a2e;
      --surface3: #252540;
      --border: #2a2a45;
      --text: #f1f0ff;
      --text2: #a5a4c8;
      --text3: #6b6a8a;
      --radius: 16px;
      --radius-s: 10px;
      --radius-xs: 6px;
      --shadow: 0 8px 32px rgba(124, 58, 237, .15);
      --transition: .3s cubic-bezier(.4, 0, .2, 1);
    }

    html, body {
      height: 100%; width: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      line-height: 1.5;
    }

    #app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Screen transitions ──────────────── */
    .screen {
      display: none;
      flex-direction: column;
      min-height: 100vh;
      animation: fadeIn .35s ease;
      padding-bottom: env(safe-area-inset-bottom, 20px);
    }
    .screen.active { display: flex; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes shimmer { to { background-position: -200% 0; } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

    /* ── Common components ────────────────── */
    .screen-header {
      padding: 20px 20px 16px;
      text-align: center;
      background: linear-gradient(180deg, var(--bg2) 0%, transparent 100%);
    }
    .screen-header h2 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -.3px;
      margin-bottom: 6px;
    }
    .screen-header p {
      font-size: 14px;
      color: var(--text2);
    }
    .screen-body {
      flex: 1;
      padding: 0 20px 20px;
      overflow-y: auto;
    }
    .screen-footer {
      padding: 16px 20px;
      padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      background: linear-gradient(0deg, var(--bg) 60%, transparent);
      position: sticky;
      bottom: 0;
    }

    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 15px 24px;
      border: none; border-radius: var(--radius);
      font-size: 16px; font-weight: 600;
      cursor: pointer; transition: var(--transition);
      color: #fff;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      box-shadow: 0 4px 20px rgba(124, 58, 237, .3);
    }
    .btn-primary:active { transform: scale(.97); }
    .btn-primary:disabled {
      opacity: .5; cursor: not-allowed; transform: none;
    }
    .btn-secondary {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-secondary:active { background: var(--surface3); }
    .btn-ghost {
      background: transparent;
      color: var(--text2);
      font-size: 14px;
      padding: 10px;
    }
    .btn-sm {
      padding: 10px 18px;
      font-size: 14px;
      border-radius: var(--radius-s);
      width: auto;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      transition: var(--transition);
    }
    .card.selectable { cursor: pointer; }
    .card.selectable:active { transform: scale(.97); }
    .card.selected {
      border-color: var(--primary);
      background: rgba(124, 58, 237, .08);
      box-shadow: 0 0 0 1px var(--primary);
    }

    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 14px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 100px;
      font-size: 13px;
      cursor: pointer; transition: var(--transition);
      color: var(--text2);
      white-space: nowrap;
    }
    .chip:active { transform: scale(.95); }
    .chip.selected {
      background: rgba(124, 58, 237, .15);
      border-color: var(--primary);
      color: var(--primary-light);
    }

    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 10px;
      background: rgba(124, 58, 237, .12);
      border: 1px solid rgba(124, 58, 237, .25);
      border-radius: 100px;
      font-size: 11px; font-weight: 600;
      color: var(--primary-light);
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .progress-bar {
      width: 100%; height: 6px;
      background: var(--surface3);
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      border-radius: 3px;
      transition: width .5s ease;
    }

    .input-field {
      width: 100%; padding: 14px 16px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-s);
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: var(--transition);
    }
    .input-field:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(124, 58, 237, .15);
    }
    .input-field::placeholder { color: var(--text3); }
    textarea.input-field { min-height: 100px; resize: vertical; }

    .step-dots {
      display: flex; gap: 6px; justify-content: center; margin: 12px 0;
    }
    .step-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--surface3);
      transition: var(--transition);
    }
    .step-dot.active {
      background: var(--primary);
      width: 24px;
      border-radius: 4px;
    }
    .step-dot.done { background: var(--success); }

    .usage-bar {
      display: flex; gap: 4px; margin: 8px 0;
    }
    .usage-block {
      flex: 1; height: 8px;
      border-radius: 4px;
      background: var(--surface3);
      transition: var(--transition);
    }
    .usage-block.used { background: var(--primary); }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--surface3);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    /* ── Screen: Splash ──────────────────── */
    .splash {
      display: flex;
      align-items: center; justify-content: center;
      min-height: 100vh;
      background: radial-gradient(ellipse at 50% 30%, rgba(124, 58, 237, .2), transparent 70%),
                  var(--bg);
    }
    .splash-content { text-align: center; }
    .splash-icon { font-size: 72px; animation: float 3s ease-in-out infinite; display: block; margin-bottom: 20px; }
    .splash-title {
      font-size: 28px; font-weight: 800; letter-spacing: -.5px;
      background: linear-gradient(135deg, #fff 30%, var(--primary-light));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 8px;
    }
    .splash-sub { color: var(--text2); font-size: 14px; }
    .splash .spinner { margin: 24px auto 0; }

    /* ── Screen: Language ────────────────── */
    .lang-grid {
      display: flex; flex-direction: column; gap: 12px;
      max-width: 360px; margin: 32px auto 0;
    }
    .lang-btn {
      display: flex; align-items: center; gap: 14px;
      padding: 18px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer; transition: var(--transition);
      text-align: left;
    }
    .lang-btn:active { transform: scale(.97); }
    .lang-btn .flag { font-size: 32px; }
    .lang-btn .lang-name { font-size: 17px; font-weight: 600; }
    .lang-btn .lang-native { font-size: 13px; color: var(--text2); }

    /* ── Screen: Welcome ─────────────────── */
    .welcome-hero {
      text-align: center;
      padding: 40px 20px 24px;
      background: radial-gradient(ellipse at 50% 0%, rgba(124, 58, 237, .2), transparent 70%);
    }
    .welcome-hero .avatar {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex; align-items: center; justify-content: center;
      font-size: 36px; margin: 0 auto 16px;
      box-shadow: 0 8px 30px rgba(124, 58, 237, .3);
    }
    .welcome-hero h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    .welcome-hero p { color: var(--text2); font-size: 14px; max-width: 280px; margin: 0 auto; }

    .features-list {
      display: flex; flex-direction: column; gap: 12px;
      padding: 0 20px; margin: 24px 0;
    }
    .feature-item {
      display: flex; gap: 12px; align-items: flex-start;
      padding: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-s);
    }
    .feature-item .icon { font-size: 24px; flex-shrink: 0; }
    .feature-item .label { font-size: 14px; font-weight: 500; }
    .feature-item .desc { font-size: 12px; color: var(--text2); }

    .phone-section {
      padding: 0 20px;
      margin-top: 8px;
    }
    .phone-section label {
      font-size: 13px; color: var(--text2);
      display: block; margin-bottom: 8px;
    }

    /* ── Screen: Onboarding ──────────────── */
    .onboard-question {
      font-size: 18px; font-weight: 600;
      text-align: center;
      margin-bottom: 20px;
    }
    .onboard-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .onboard-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
    .onboard-card {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 8px; padding: 18px 10px;
      text-align: center;
    }
    .onboard-card .card-emoji { font-size: 32px; }
    .onboard-card .card-label { font-size: 13px; font-weight: 500; }

    .chips-wrap {
      display: flex; flex-wrap: wrap; gap: 8px;
      justify-content: center;
    }

    /* ── Screen: Upload ──────────────────── */
    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: var(--transition);
      background: var(--surface);
    }
    .upload-zone:active, .upload-zone.dragover {
      border-color: var(--primary);
      background: rgba(124, 58, 237, .05);
    }
    .upload-zone .upload-icon { font-size: 48px; margin-bottom: 12px; display: block; }
    .upload-zone .upload-text { font-size: 15px; font-weight: 500; margin-bottom: 4px; }
    .upload-zone .upload-hint { font-size: 12px; color: var(--text3); }

    .photo-previews {
      display: flex; gap: 10px; margin-top: 16px;
      overflow-x: auto; padding-bottom: 8px;
    }
    .photo-preview {
      position: relative;
      width: 100px; height: 100px;
      border-radius: var(--radius-s);
      overflow: hidden;
      flex-shrink: 0;
      border: 2px solid var(--border);
    }
    .photo-preview img {
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .photo-preview .remove-photo {
      position: absolute; top: 4px; right: 4px;
      width: 24px; height: 24px;
      background: rgba(0,0,0,.7);
      border: none; border-radius: 50%;
      color: #fff; font-size: 14px;
      cursor: pointer; display: flex;
      align-items: center; justify-content: center;
    }

    /* ── Screen: Design Mode ─────────────── */
    .mode-cards {
      display: flex; flex-direction: column; gap: 12px;
    }
    .mode-card {
      display: flex; align-items: center; gap: 16px;
      padding: 20px;
    }
    .mode-card .mode-icon { font-size: 40px; flex-shrink: 0; }
    .mode-card .mode-info h3 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .mode-card .mode-info p { font-size: 13px; color: var(--text2); }

    /* ── Screen: Styles ──────────────────── */
    .styles-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .style-card {
      display: flex; flex-direction: column;
      align-items: center; gap: 6px;
      padding: 14px 6px;
      text-align: center;
    }
    .style-card .style-emoji { font-size: 26px; }
    .style-card .style-name { font-size: 11px; font-weight: 500; line-height: 1.3; }

    /* ── Screen: Generating ──────────────── */
    .generating-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
      text-align: center;
      background: radial-gradient(ellipse at 50% 40%, rgba(124, 58, 237, .12), transparent 70%);
    }
    .gen-visual {
      width: 120px; height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(124,58,237,.15), rgba(236,72,153,.1));
      border: 2px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 48px; margin-bottom: 28px;
      animation: float 3s ease-in-out infinite;
      position: relative;
    }
    .gen-visual::after {
      content: "";
      position: absolute; inset: -4px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: var(--primary);
      animation: spin 2s linear infinite;
    }
    .gen-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    .gen-subtitle { font-size: 14px; color: var(--text2); margin-bottom: 24px; }
    .gen-steps {
      display: flex; flex-direction: column; gap: 12px;
      width: 100%; max-width: 280px;
    }
    .gen-step {
      display: flex; align-items: center; gap: 10px;
      font-size: 14px; color: var(--text3);
      transition: var(--transition);
    }
    .gen-step.active { color: var(--text); }
    .gen-step.done { color: var(--success); }
    .gen-step-icon { width: 20px; text-align: center; }

    /* ── Screen: Result ──────────────────── */
    .result-header {
      padding: 16px 20px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .result-header h2 { font-size: 20px; font-weight: 700; }

    .comparison-container {
      position: relative;
      width: 100%;
      aspect-ratio: 4/3;
      overflow: hidden;
      border-radius: var(--radius);
      margin: 0 auto;
      touch-action: none;
      background: var(--surface);
    }
    .comparison-container img {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .comparison-after { clip-path: inset(0 0 0 0); }
    .comparison-before { clip-path: inset(0 50% 0 0); }
    .comparison-slider {
      position: absolute;
      top: 0; bottom: 0;
      left: 50%;
      width: 3px;
      background: #fff;
      cursor: ew-resize;
      z-index: 5;
      transform: translateX(-50%);
    }
    .comparison-slider::after {
      content: "\2194";
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 40px; height: 40px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 10px rgba(0,0,0,.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: #333;
    }
    .comparison-label {
      position: absolute;
      top: 12px;
      padding: 4px 10px;
      background: rgba(0,0,0,.6);
      border-radius: 100px;
      font-size: 11px; font-weight: 600;
      color: #fff; z-index: 4;
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    .comparison-label.before { left: 12px; }
    .comparison-label.after { right: 12px; }

    .result-actions {
      display: flex; gap: 10px;
      padding: 16px 20px;
    }
    .result-actions .btn { flex: 1; }

    .result-info {
      padding: 0 20px;
    }
    .info-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
    }
    .info-card h4 { font-size: 14px; font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .info-card .info-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 0;
      font-size: 13px;
    }
    .info-card .info-row .label { color: var(--text2); }

    /* ── Screen: Modify ──────────────────── */
    .modify-preview {
      width: 100%;
      aspect-ratio: 4/3;
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 16px;
    }
    .modify-preview img { width: 100%; height: 100%; object-fit: cover; }

    .modify-suggestions {
      display: flex; flex-wrap: wrap; gap: 6px;
      margin-bottom: 12px;
    }
    .modify-suggestions .chip { font-size: 12px; padding: 6px 12px; }

    /* ── Screen: Limit ───────────────────── */
    .limit-screen {
      display: flex;
      flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
      text-align: center;
    }
    .limit-icon { font-size: 64px; margin-bottom: 20px; }
    .limit-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .limit-desc { font-size: 14px; color: var(--text2); max-width: 300px; margin-bottom: 24px; }
    .limit-price {
      font-size: 28px; font-weight: 800;
      background: linear-gradient(135deg, var(--primary-light), var(--accent));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 4px;
    }
    .limit-price-sub { font-size: 13px; color: var(--text3); margin-bottom: 24px; }
    .payment-methods {
      display: flex; gap: 12px; margin-bottom: 24px;
    }
    .payment-methods span {
      padding: 8px 16px;
      background: var(--surface2);
      border-radius: var(--radius-s);
      font-size: 14px; font-weight: 500;
    }

    /* ── Toast ────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 100px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-s);
      padding: 12px 20px;
      font-size: 14px;
      z-index: 1000;
      opacity: 0;
      transition: var(--transition);
      pointer-events: none;
      max-width: 90%;
      text-align: center;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .toast.error { border-color: var(--error); color: var(--error); }

    /* ── Back button header ──────────────── */
    .top-bar {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 20px;
    }
    .top-bar .back-btn {
      width: 36px; height: 36px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: var(--text);
      font-size: 18px;
      transition: var(--transition);
    }
    .top-bar .back-btn:active { transform: scale(.9); }
    .top-bar .top-title { font-size: 16px; font-weight: 600; }

    /* ── Utilities ────────────────────────── */
    .text-center { text-align: center; }
    .mt-8 { margin-top: 8px; }
    .mt-12 { margin-top: 12px; }
    .mt-16 { margin-top: 16px; }
    .mt-20 { margin-top: 20px; }
    .mt-24 { margin-top: 24px; }
    .mb-8 { margin-bottom: 8px; }
    .mb-16 { margin-bottom: 16px; }
    .hidden { display: none !important; }
  </style>
</head>

<div id="app">
  <!-- Splash -->
  <div id="screen-splash" class="screen splash active">
    <div class="splash-content">
      <span class="splash-icon">🏠</span>
      <div class="splash-title">LiveSpace AI</div>
      <p class="splash-sub">Your AI Interior Designer</p>
      <div class="spinner"></div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>
<input type="file" id="file-input" accept="image/*" multiple style="display:none" />
