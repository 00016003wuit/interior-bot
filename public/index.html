<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
  <title>LiveSpace AI</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #7c3aed;
      --primary-light: #a78bfa;
      --primary-dark: #5b21b6;
      --accent: #ec4899;
      --accent2: #f472b6;
      --success: #10b981;
      --warning: #f59e0b;
      --error: #ef4444;
      --bg: #09090f;
      --bg2: #0f0f1a;
      --surface: #13131f;
      --surface2: #1a1a2e;
      --surface3: #252540;
      --border: #2a2a45;
      --text: #f1f0ff;
      --text2: #a5a4c8;
      --text3: #6b6a8a;
      --radius: 16px;
      --radius-s: 10px;
      --radius-xs: 6px;
      --shadow: 0 8px 32px rgba(124, 58, 237, .15);
      --transition: .3s cubic-bezier(.4, 0, .2, 1);
    }

    html, body {
      height: 100%; width: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      line-height: 1.5;
    }

    #app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Screen transitions ──────────────── */
    .screen {
      display: none;
      flex-direction: column;
      min-height: 100vh;
      animation: fadeIn .35s ease;
      padding-bottom: env(safe-area-inset-bottom, 20px);
    }
    .screen.active { display: flex; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes shimmer { to { background-position: -200% 0; } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

    /* ── Common components ────────────────── */
    .screen-header {
      padding: 20px 20px 16px;
      text-align: center;
      background: linear-gradient(180deg, var(--bg2) 0%, transparent 100%);
    }
    .screen-header h2 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -.3px;
      margin-bottom: 6px;
    }
    .screen-header p {
      font-size: 14px;
      color: var(--text2);
    }
    .screen-body {
      flex: 1;
      padding: 0 20px 20px;
      overflow-y: auto;
    }
    .screen-footer {
      padding: 16px 20px;
      padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      background: linear-gradient(0deg, var(--bg) 60%, transparent);
      position: sticky;
      bottom: 0;
    }

    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 15px 24px;
      border: none; border-radius: var(--radius);
      font-size: 16px; font-weight: 600;
      cursor: pointer; transition: var(--transition);
      color: #fff;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      box-shadow: 0 4px 20px rgba(124, 58, 237, .3);
    }
    .btn-primary:active { transform: scale(.97); }
    .btn-primary:disabled {
      opacity: .5; cursor: not-allowed; transform: none;
    }
    .btn-secondary {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-secondary:active { background: var(--surface3); }
    .btn-ghost {
      background: transparent;
      color: var(--text2);
      font-size: 14px;
      padding: 10px;
    }
    .btn-sm {
      padding: 10px 18px;
      font-size: 14px;
      border-radius: var(--radius-s);
      width: auto;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      transition: var(--transition);
    }
    .card.selectable { cursor: pointer; }
    .card.selectable:active { transform: scale(.97); }
    .card.selected {
      border-color: var(--primary);
      background: rgba(124, 58, 237, .08);
      box-shadow: 0 0 0 1px var(--primary);
    }

    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 14px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 100px;
      font-size: 13px;
      cursor: pointer; transition: var(--transition);
      color: var(--text2);
      white-space: nowrap;
    }
    .chip:active { transform: scale(.95); }
    .chip.selected {
      background: rgba(124, 58, 237, .15);
      border-color: var(--primary);
      color: var(--primary-light);
    }

    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 10px;
      background: rgba(124, 58, 237, .12);
      border: 1px solid rgba(124, 58, 237, .25);
      border-radius: 100px;
      font-size: 11px; font-weight: 600;
      color: var(--primary-light);
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .progress-bar {
      width: 100%; height: 6px;
      background: var(--surface3);
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      border-radius: 3px;
      transition: width .5s ease;
    }

    .input-field {
      width: 100%; padding: 14px 16px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-s);
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: var(--transition);
    }
    .input-field:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(124, 58, 237, .15);
    }
    .input-field::placeholder { color: var(--text3); }
    textarea.input-field { min-height: 100px; resize: vertical; }

    .step-dots {
      display: flex; gap: 6px; justify-content: center; margin: 12px 0;
    }
    .step-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--surface3);
      transition: var(--transition);
    }
    .step-dot.active {
      background: var(--primary);
      width: 24px;
      border-radius: 4px;
    }
    .step-dot.done { background: var(--success); }

    .usage-bar {
      display: flex; gap: 4px; margin: 8px 0;
    }
    .usage-block {
      flex: 1; height: 8px;
      border-radius: 4px;
      background: var(--surface3);
      transition: var(--transition);
    }
    .usage-block.used { background: var(--primary); }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--surface3);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    /* ── Screen: Splash ──────────────────── */
    .splash {
      display: flex;
      align-items: center; justify-content: center;
      min-height: 100vh;
      background: radial-gradient(ellipse at 50% 30%, rgba(124, 58, 237, .2), transparent 70%),
                  var(--bg);
    }
    .splash-content { text-align: center; }
    .splash-icon { font-size: 72px; animation: float 3s ease-in-out infinite; display: block; margin-bottom: 20px; }
    .splash-title {
      font-size: 28px; font-weight: 800; letter-spacing: -.5px;
      background: linear-gradient(135deg, #fff 30%, var(--primary-light));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 8px;
    }
    .splash-sub { color: var(--text2); font-size: 14px; }
    .scroll-arrow {
      margin-top: 32px;
      animation: bounce 2s ease-in-out infinite;
      cursor: pointer;
      font-size: 28px;
      color: var(--primary-light);
      opacity: .7;
      transition: opacity .3s;
    }
    .scroll-arrow:hover { opacity: 1; }
    @keyframes bounce {
      0%,20%,50%,80%,100% { transform: translateY(0); }
      40% { transform: translateY(10px); }
      60% { transform: translateY(5px); }
    }

    /* ── Screen: Language ────────────────── */
    .lang-grid {
      display: flex; flex-direction: column; gap: 12px;
      max-width: 360px; margin: 32px auto 0;
    }
    .lang-btn {
      display: flex; align-items: center; gap: 14px;
      padding: 18px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer; transition: var(--transition);
      text-align: left;
    }
    .lang-btn:active { transform: scale(.97); }
    .lang-btn .flag { font-size: 32px; }
    .lang-btn .lang-name { font-size: 17px; font-weight: 600; }
    .lang-btn .lang-native { font-size: 13px; color: var(--text2); }

    /* ── Screen: Welcome ─────────────────── */
    .welcome-hero {
      text-align: center;
      padding: 40px 20px 24px;
      background: radial-gradient(ellipse at 50% 0%, rgba(124, 58, 237, .2), transparent 70%);
    }
    .welcome-hero .avatar {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex; align-items: center; justify-content: center;
      font-size: 36px; margin: 0 auto 16px;
      box-shadow: 0 8px 30px rgba(124, 58, 237, .3);
    }
    .welcome-hero h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    .welcome-hero p { color: var(--text2); font-size: 14px; max-width: 280px; margin: 0 auto; }

    .features-list {
      display: flex; flex-direction: column; gap: 12px;
      padding: 0 20px; margin: 24px 0;
    }
    .feature-item {
      display: flex; gap: 12px; align-items: flex-start;
      padding: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-s);
    }
    .feature-item .icon { font-size: 24px; flex-shrink: 0; }
    .feature-item .label { font-size: 14px; font-weight: 500; }
    .feature-item .desc { font-size: 12px; color: var(--text2); }

    .phone-section {
      padding: 0 20px;
      margin-top: 8px;
    }
    .phone-section label {
      font-size: 13px; color: var(--text2);
      display: block; margin-bottom: 8px;
    }

    /* ── Screen: Onboarding ──────────────── */
    .onboard-question {
      font-size: 18px; font-weight: 600;
      text-align: center;
      margin-bottom: 20px;
    }
    .onboard-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .onboard-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
    .onboard-card {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 8px; padding: 18px 10px;
      text-align: center;
    }
    .onboard-card .card-emoji { font-size: 32px; }
    .onboard-card .card-label { font-size: 13px; font-weight: 500; }

    .chips-wrap {
      display: flex; flex-wrap: wrap; gap: 8px;
      justify-content: center;
    }

    /* ── Screen: Upload ──────────────────── */
    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: var(--transition);
      background: var(--surface);
    }
    .upload-zone:active, .upload-zone.dragover {
      border-color: var(--primary);
      background: rgba(124, 58, 237, .05);
    }
    .upload-zone .upload-icon { font-size: 48px; margin-bottom: 12px; display: block; }
    .upload-zone .upload-text { font-size: 15px; font-weight: 500; margin-bottom: 4px; }
    .upload-zone .upload-hint { font-size: 12px; color: var(--text3); }

    .photo-previews {
      display: flex; gap: 10px; margin-top: 16px;
      overflow-x: auto; padding-bottom: 8px;
    }
    .photo-preview {
      position: relative;
      width: 100px; height: 100px;
      border-radius: var(--radius-s);
      overflow: hidden;
      flex-shrink: 0;
      border: 2px solid var(--border);
    }
    .photo-preview img {
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .photo-preview .remove-photo {
      position: absolute; top: 4px; right: 4px;
      width: 24px; height: 24px;
      background: rgba(0,0,0,.7);
      border: none; border-radius: 50%;
      color: #fff; font-size: 14px;
      cursor: pointer; display: flex;
      align-items: center; justify-content: center;
    }

    /* ── Screen: Design Mode ─────────────── */
    .mode-cards {
      display: flex; flex-direction: column; gap: 12px;
    }
    .mode-card {
      display: flex; align-items: center; gap: 16px;
      padding: 20px;
    }
    .mode-card .mode-icon { font-size: 40px; flex-shrink: 0; }
    .mode-card .mode-info h3 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .mode-card .mode-info p { font-size: 13px; color: var(--text2); }

    /* ── Screen: Styles ──────────────────── */
    .styles-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .style-card {
      display: flex; flex-direction: column;
      align-items: center; gap: 6px;
      padding: 14px 6px;
      text-align: center;
    }
    .style-card .style-emoji { font-size: 26px; }
    .style-card .style-name { font-size: 11px; font-weight: 500; line-height: 1.3; }

    /* ── Screen: Generating ──────────────── */
    .generating-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
      text-align: center;
      background: radial-gradient(ellipse at 50% 40%, rgba(124, 58, 237, .12), transparent 70%);
    }
    .gen-visual {
      width: 120px; height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(124,58,237,.15), rgba(236,72,153,.1));
      border: 2px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 48px; margin-bottom: 28px;
      animation: float 3s ease-in-out infinite;
      position: relative;
    }
    .gen-visual::after {
      content: "";
      position: absolute; inset: -4px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: var(--primary);
      animation: spin 2s linear infinite;
    }
    .gen-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    .gen-subtitle { font-size: 14px; color: var(--text2); margin-bottom: 24px; }
    .gen-steps {
      display: flex; flex-direction: column; gap: 12px;
      width: 100%; max-width: 280px;
    }
    .gen-step {
      display: flex; align-items: center; gap: 10px;
      font-size: 14px; color: var(--text3);
      transition: var(--transition);
    }
    .gen-step.active { color: var(--text); }
    .gen-step.done { color: var(--success); }
    .gen-step-icon { width: 20px; text-align: center; }

    /* ── Screen: Result ──────────────────── */
    .result-header {
      padding: 16px 20px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .result-header h2 { font-size: 20px; font-weight: 700; }

    .comparison-container {
      position: relative;
      width: 100%;
      aspect-ratio: 4/3;
      overflow: hidden;
      border-radius: var(--radius);
      margin: 0 auto;
      touch-action: none;
      background: var(--surface);
    }
    .comparison-container img {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .comparison-after { clip-path: inset(0 0 0 0); }
    .comparison-before { clip-path: inset(0 50% 0 0); }
    .comparison-slider {
      position: absolute;
      top: 0; bottom: 0;
      left: 50%;
      width: 3px;
      background: #fff;
      cursor: ew-resize;
      z-index: 5;
      transform: translateX(-50%);
    }
    .comparison-slider::after {
      content: "\2194";
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 40px; height: 40px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 10px rgba(0,0,0,.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: #333;
    }
    .comparison-label {
      position: absolute;
      top: 12px;
      padding: 4px 10px;
      background: rgba(0,0,0,.6);
      border-radius: 100px;
      font-size: 11px; font-weight: 600;
      color: #fff; z-index: 4;
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    .comparison-label.before { left: 12px; }
    .comparison-label.after { right: 12px; }

    .result-actions {
      display: flex; gap: 10px;
      padding: 16px 20px;
    }
    .result-actions .btn { flex: 1; }

    .result-info {
      padding: 0 20px;
    }
    .info-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
    }
    .info-card h4 { font-size: 14px; font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .info-card .info-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 0;
      font-size: 13px;
    }
    .info-card .info-row .label { color: var(--text2); }

    /* ── Screen: Modify ──────────────────── */
    .modify-preview {
      width: 100%;
      aspect-ratio: 4/3;
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 16px;
    }
    .modify-preview img { width: 100%; height: 100%; object-fit: cover; }

    .modify-suggestions {
      display: flex; flex-wrap: wrap; gap: 6px;
      margin-bottom: 12px;
    }
    .modify-suggestions .chip { font-size: 12px; padding: 6px 12px; }

    /* ── Screen: Limit ───────────────────── */
    .limit-screen {
      display: flex;
      flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
      text-align: center;
    }
    .limit-icon { font-size: 64px; margin-bottom: 20px; }
    .limit-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .limit-desc { font-size: 14px; color: var(--text2); max-width: 300px; margin-bottom: 24px; }
    .limit-price {
      font-size: 28px; font-weight: 800;
      background: linear-gradient(135deg, var(--primary-light), var(--accent));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 4px;
    }
    .limit-price-sub { font-size: 13px; color: var(--text3); margin-bottom: 24px; }
    .payment-methods {
      display: flex; gap: 12px; margin-bottom: 24px;
    }
    .payment-methods span {
      padding: 8px 16px;
      background: var(--surface2);
      border-radius: var(--radius-s);
      font-size: 14px; font-weight: 500;
    }

    /* ── Toast ────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 100px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-s);
      padding: 12px 20px;
      font-size: 14px;
      z-index: 1000;
      opacity: 0;
      transition: var(--transition);
      pointer-events: none;
      max-width: 90%;
      text-align: center;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .toast.error { border-color: var(--error); color: var(--error); }

    /* ── Back button header ──────────────── */
    .top-bar {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 20px;
    }
    .top-bar .back-btn {
      width: 36px; height: 36px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: var(--text);
      font-size: 18px;
      transition: var(--transition);
    }
    .top-bar .back-btn:active { transform: scale(.9); }
    .top-bar .top-title { font-size: 16px; font-weight: 600; }

    /* ── Utilities ────────────────────────── */
    .text-center { text-align: center; }
    .mt-8 { margin-top: 8px; }
    .mt-12 { margin-top: 12px; }
    .mt-16 { margin-top: 16px; }
    .mt-20 { margin-top: 20px; }
    .mt-24 { margin-top: 24px; }
    .mb-8 { margin-bottom: 8px; }
    .mb-16 { margin-bottom: 16px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<div id="app">
  <!-- Splash -->
  <div id="screen-splash" class="screen splash active">
    <div class="splash-content">
      <span class="splash-icon">🏠</span>
      <div class="splash-title">LiveSpace AI</div>
      <p class="splash-sub">Your AI Interior Designer</p>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>
<input type="file" id="file-input" accept="image/*" multiple style="display:none" />

<script>
// ═══════════════════════════════════════════════
//  LiveSpace AI — Telegram Mini App
// ═══════════════════════════════════════════════

const tg = window.Telegram?.WebApp;
const API = '';

// ── State ────────────────────────────────────
const state = {
  user: null,
  lang: 'en',
  usage: { used: 0, limit: 5, remaining: 5 },
  currentScreen: 'splash',
  onboardStep: 0,
  prefs: { roomType: null, ownership: null, goal: null, budget: null, priorities: [] },
  photos: [],
  photoUrls: [],
  designMode: null,
  selectedStyle: null,
  customPrompt: '',
  result: null,
  errorMessage: '',
  lastAction: null,
};

// ── Translations ─────────────────────────────
const T = {
  en: {
    chooseLang: "Choose your language",
    welcome: "Welcome",

// ── API helpers ──────────────────────────────
async function api(path, body) {
  const res = await fetch(API + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (!res.ok) throw { status: res.status, ...data };
  return data;
}

// ── Screen management ────────────────────────
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  let el = document.getElementById('screen-' + name);
  if (!el) {
    el = document.createElement('div');
    el.id = 'screen-' + name;
    el.className = 'screen';
    document.getElementById('app').appendChild(el);
  }
  const renderer = screens[name];
  if (renderer) renderer(el);
  el.classList.add('active');
  state.currentScreen = name;
  window.scrollTo(0, 0);
  if (['splash', 'language'].includes(name)) tg?.BackButton?.hide();
  else tg?.BackButton?.show();
}

screens.onboarding = (el) => {
  const step = state.onboardStep;
  const total = 4;
  const dots = Array.from({length: total}, (_, i) =>
    `<div class="step-dot ${i < step ? 'done' : ''} ${i === step ? 'active' : ''}"></div>`
  ).join('');

  let content = '';
  if (step === 0) {
    content = `<div class="onboard-question">${t('onboard1')}</div><div class="onboard-grid">${
      Object.entries(ROOMS).map(([k, v]) =>
        `<div class="card selectable onboard-card ${state.prefs.roomType === k ? 'selected' : ''}" onclick="selectPref('roomType','${k}')">
          <span class="card-emoji">${v.emoji}</span><span class="card-label">${label(v)}</span>
        </div>`
      ).join('')}</div>`;
  } else if (step === 1) {
    content = `<div class="onboard-question">${t('onboard3')}</div><div class="onboard-grid">${
      Object.entries(GOALS).map(([k, v]) =>
        `<div class="card selectable onboard-card ${state.prefs.goal === k ? 'selected' : ''}" onclick="selectPref('goal','${k}')">
          <span class="card-emoji">${v.emoji}</span><span class="card-label">${label(v)}</span>
        </div>`
      ).join('')}</div>`;
  } else if (step === 2) {
    const icons = { low: '\u{1F4B5}', mid: '\u{1F4B0}', high: '\u{1F48E}', premium: '\u{1F451}' };
    content = `<div class="onboard-question">${t('onboard4')}</div><div class="onboard-grid">${
      Object.entries(BUDGETS).map(([k, v]) =>
        `<div class="card selectable onboard-card ${state.prefs.budget === k ? 'selected' : ''}" onclick="selectPref('budget','${k}')">
          <span class="card-emoji">${icons[k]}</span><span class="card-label">${label(v)}</span>
        </div>`
      ).join('')}</div>`;
  } else if (step === 3) {
    content = `<div class="onboard-question">${t('onboard6')}</div><div class="chips-wrap">${
      Object.entries(PRIORITIES).map(([k, v]) =>
        `<div class="chip ${state.prefs.priorities.includes(k) ? 'selected' : ''}" onclick="togglePriority('${k}')">${v.emoji} ${label(v)}</div>`
      ).join('')}</div>`;
  }

  const canNext = step === 0 ? state.prefs.roomType : step === 1 ? state.prefs.goal : step === 2 ? state.prefs.budget : true;

  el.innerHTML = `
    <div class="top-bar"><div class="back-btn" onclick="onboardBack()">\u2190</div><div class="top-title">${step + 1}/${total}</div></div>
    <div class="step-dots">${dots}</div>
    <div class="screen-body">${content}</div>
    <div class="screen-footer">
      <button class="btn btn-primary" ${canNext ? '' : 'disabled'} onclick="onboardNext()">${step === total - 1 ? t('letsGo') : t('next')}</button>
      ${step === 3 ? `<button class="btn btn-ghost" onclick="onboardNext()">${t('skip')}</button>` : ''}
    </div>`;
};

    </div>
    <div class="screen-footer">
      <button class="btn btn-primary" id="cgen" ${state.customPrompt.trim() ? '' : 'disabled'} onclick="startGeneration()">${t('generateBtn')}</button>
    </div>`;
};

screens.generating = (el) => {
  el.innerHTML = `
    <div class="generating-screen">
      <div class="gen-visual">\u{1F3E0}</div>
      <div class="gen-title">${t('generating')}</div>
      <div class="gen-subtitle">${t('genDesc')}</div>
      <div class="gen-steps">
        <div class="gen-step active" id="gs1"><span class="gen-step-icon">\u25CF</span> ${t('genStep1')}</div>
        <div class="gen-step" id="gs2"><span class="gen-step-icon">\u25CF</span> ${t('genStep2')}</div>
        <div class="gen-step" id="gs3"><span class="gen-step-icon">\u25CF</span> ${t('genStep3')}</div>
        <div class="gen-step" id="gs4"><span class="gen-step-icon">\u25CF</span> ${t('genStep4')}</div>
      </div>
    </div>`;
  [2, 3, 4].forEach((s, i) => {
    setTimeout(() => {
      const prev = document.getElementById('gs' + (s - 1));
      const curr = document.getElementById('gs' + s);
      if (prev) { prev.classList.remove('active'); prev.classList.add('done'); prev.querySelector('.gen-step-icon').textContent = '\u2713'; }
      if (curr) curr.classList.add('active');
    }, (i + 1) * 8000);
  });
};

screens.result = (el) => {
  const r = state.result;
  if (!r) return;
  const sty = state.selectedStyle && STYLES[state.selectedStyle] ? `${STYLES[state.selectedStyle].emoji} ${label(STYLES[state.selectedStyle])}` : (state.customPrompt ? '\u270F\uFE0F Custom' : '-');
  const gol = state.prefs.goal && GOALS[state.prefs.goal] ? `${GOALS[state.prefs.goal].emoji} ${label(GOALS[state.prefs.goal])}` : '-';
  const bud = state.prefs.budget && BUDGETS[state.prefs.budget] ? label(BUDGETS[state.prefs.budget]) : '-';
  const ub = Array.from({length: state.usage.limit}, (_, i) => `<div class="usage-block ${i < state.usage.used ? 'used' : ''}"></div>`).join('');

  el.innerHTML = `
    <div class="result-header">
      <h2>${t('resultTitle')}</h2>
      <div class="badge">${state.usage.remaining} ${t('freeDesigns')}</div>
    </div>
    <div style="padding:0 20px;">
      <div class="comparison-container" id="comparison">
        <img src="${r.generatedUrl}" class="comparison-after" alt="After" />
        <img src="${r.originalUrl}" class="comparison-before" id="comp-before" alt="Before" />
        <div class="comparison-slider" id="comp-slider"></div>
        <span class="comparison-label before">${t('before')}</span>
        <span class="comparison-label after">${t('after')}</span>
      </div>
    </div>
    <div class="result-actions">
      <button class="btn btn-primary btn-sm" onclick="showScreen('modify')">\u270F\uFE0F ${t('modifyBtn')}</button>
      <button class="btn btn-secondary btn-sm" onclick="tryAnother()">\u{1F3A8} ${t('tryStyle')}</button>
      <button class="btn btn-secondary btn-sm" onclick="shareResult()">\u2197 ${t('shareBtn')}</button>
    </div>
    <div class="result-info">
      <div class="info-card">
        <h4>\u{1F3A8} ${t('designInfo')}</h4>
        <div class="info-row"><span class="label">${t('styleLabel')}</span><span>${sty}</span></div>
        <div class="info-row"><span class="label">${t('goalLabel')}</span><span>${gol}</span></div>
        <div class="info-row"><span class="label">${t('budgetLabel')}</span><span>${bud}</span></div>
      </div>
      <div class="info-card">
        <h4>\u{1F4CA} ${t('usageInfo')}</h4>
        <div class="usage-bar">${ub}</div>
        <div class="info-row"><span class="label">${t('freeDesigns')}</span><span>${state.usage.remaining}</span></div>
      </div>
    </div>
    <div style="padding:16px 20px;">
      <button class="btn btn-secondary" onclick="startNewDesign()">\u{1F4F8} ${t('newDesign')}</button>
    </div>`;
  requestAnimationFrame(initSlider);
};

screens.modify = (el) => {
  const r = state.result;
  const sugs = [t('modifySug1'), t('modifySug2'), t('modifySug3'), t('modifySug4'), t('modifySug5'), t('modifySug6')];
  el.innerHTML = `
    <div class="top-bar"><div class="back-btn" onclick="goBack()">\u2190</div><div class="top-title">${t('modifyTitle')}</div></div>
    <div class="screen-body">
      ${r ? `<div class="modify-preview"><img src="${r.generatedUrl}" /></div>` : ''}
      <p style="font-size:13px;color:var(--text2);margin-bottom:12px;">${t('modifyDesc')}</p>
      <div class="modify-suggestions">${sugs.map(s => `<div class="chip" onclick="document.getElementById('mt').value='${esc(s)}';document.getElementById('mt').dispatchEvent(new Event('input'))">${s}</div>`).join('')}</div>
      <textarea class="input-field" id="mt" placeholder="${t('modifyPlaceholder')}" oninput="document.getElementById('mbtn').disabled=!this.value.trim()"></textarea>
      <p class="mt-8" style="font-size:12px;color:var(--text3);">${t('modifyHint')}</p>
    </div>
    <div class="screen-footer">
      <button class="btn btn-primary" id="mbtn" disabled onclick="applyModification()">${t('applyChanges')}</button>
    </div>`;
};

screens.limit = (el) => {
  el.innerHTML = `
    <div class="limit-screen">
      <span class="limit-icon">\u{1F512}</span>
      <div class="limit-title">${t('limitTitle')}</div>
      <div class="limit-desc">${t('limitDesc')}</div>
      <div class="limit-price">10,000 UZS</div>
      <div class="limit-price-sub">${t('limitFor3')}</div>
      <div class="payment-methods"><span>Click</span><span>Payme</span><span>Uzum</span></div>
      <button class="btn btn-primary" style="max-width:320px;" onclick="if(tg)tg.close()">${t('contactSupport')}</button>
      ${state.result ? `<button class="btn btn-ghost mt-12" onclick="showScreen('result')">${t('backToResult')}</button>` : ''}
      <button class="btn btn-ghost" onclick="startNewDesign()">${t('startOver')}</button>
    </div>`;
};

screens.error = (el) => {
  el.innerHTML = `
    <div class="limit-screen">
      <span class="limit-icon">\u{1F615}</span>
      <div class="limit-title">${t('error')}</div>
      <div class="limit-desc">${esc(state.errorMessage || '')}</div>
      <button class="btn btn-primary" style="max-width:280px;" onclick="if(state.lastAction)state.lastAction();else showScreen('upload')">${t('tryAgain')}</button>
      <button class="btn btn-ghost mt-12" onclick="startNewDesign()">${t('startOver')}</button>
    </div>`;
};

// ── Handlers ─────────────────────────────────
function esc(s) { return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function selectLang(lang) {
  state.lang = lang;
  if (state.user) api('/api/user/lang', { userId: state.user.id, lang }).catch(() => {});
  showScreen('welcome');
}

function shareContact() {
  if (tg?.requestContact) {
    tg.requestContact((r) => { if (r?.status === 'sent') { toast('Phone number shared!'); setTimeout(refreshUser, 2000); } });
  } else { toast('Please enter your phone number manually'); }
}

function submitWelcome(skip) {
  const phone = document.getElementById('phone-input')?.value?.trim();
  if (phone && state.user) api('/api/user/phone', { userId: state.user.id, phone }).catch(() => {});
  state.onboardStep = 0;
  showScreen('onboarding');
}

function selectPref(key, val) { state.prefs[key] = val; showScreen('onboarding'); }
function togglePriority(key) {
  const i = state.prefs.priorities.indexOf(key);
  if (i >= 0) state.prefs.priorities.splice(i, 1); else state.prefs.priorities.push(key);
  showScreen('onboarding');
}
function onboardBack() { if (state.onboardStep > 0) { state.onboardStep--; showScreen('onboarding'); } else showScreen('welcome'); }
function onboardNext() {
  if (state.onboardStep < 3) { state.onboardStep++; showScreen('onboarding'); }
  else { if (state.user) api('/api/user/prefs', { userId: state.user.id, prefs: state.prefs }).catch(() => {}); showScreen('upload'); }
}

function selectStyle(k) { state.selectedStyle = k; showScreen('styles'); }
function removePhoto(i) { state.photos.splice(i, 1); showScreen('upload'); }
function tryAnother() { state.selectedStyle = null; state.customPrompt = ''; showScreen('designMode'); }
function startNewDesign() { state.photos = []; state.photoUrls = []; state.selectedStyle = null; state.customPrompt = ''; state.result = null; state.designMode = null; showScreen('upload'); }

function shareResult() {
  if (!state.result?.generatedUrl) return;
  if (navigator.share) navigator.share({ title: 'My room redesign by LiveSpace AI', url: state.result.generatedUrl }).catch(() => {});
  else { navigator.clipboard?.writeText(state.result.generatedUrl); toast('Link copied!'); }
}

function goBack() {
  const map = { welcome:'language', onboarding:'welcome', upload:'onboarding', designMode:'upload', styles:'designMode', custom:'designMode', result:'upload', modify:'result', limit: state.result?'result':'upload', error:'upload' };
  if (state.currentScreen === 'onboarding') onboardBack();
  else showScreen(map[state.currentScreen] || 'upload');
}

async function refreshUser() {
  try { const d = await api('/api/auth', { initData: tg?.initData || '' }); if (d.user) state.user = d.user; if (d.usage) state.usage = d.usage; } catch {}
}

// File input handler
document.getElementById('file-input').addEventListener('change', (e) => {
  Array.from(e.target.files).forEach(file => {
    if (state.photos.length >= 3) return;
    const reader = new FileReader();
    reader.onload = (ev) => { state.photos.push({ file, preview: ev.target.result }); showScreen('upload'); };
    reader.readAsDataURL(file);
  });
  e.target.value = '';
});

// ── Generation ───────────────────────────────
async function startGeneration() {
  if (state.usage.remaining <= 0) { showScreen('limit'); return; }
  showScreen('generating');
  try {
    const fd = new FormData();
    state.photos.forEach(p => fd.append('photos', p.file));
    if (state.user) fd.append('userId', state.user.id);
    const upRes = await fetch(API + '/api/upload', { method: 'POST', body: fd });
    const upData = await upRes.json();
    if (!upRes.ok) throw new Error(upData.error || 'Upload failed');
    state.photoUrls = upData.urls;

    const genRes = await api('/api/generate', {
      userId: state.user?.id,
      photoUrl: state.photoUrls[0],
      roomType: state.prefs.roomType,
      styleKey: state.designMode === 'styles' ? state.selectedStyle : null,
      customPrompt: state.designMode === 'custom' ? state.customPrompt : null,
      goal: state.prefs.goal,
      budget: state.prefs.budget,
      priorities: state.prefs.priorities,
    });
    state.result = { originalUrl: genRes.originalUrl, generatedUrl: genRes.generatedUrl };
    state.usage = genRes.usage;
    showScreen('result');
  } catch (err) {
    if (err.error === 'limit_reached') { state.usage = err.usage || state.usage; showScreen('limit'); }
    else { state.errorMessage = err.message || err.error || 'Generation failed'; state.lastAction = startGeneration; showScreen('error'); }
  }
}

async function applyModification() {
  const text = document.getElementById('mt')?.value?.trim();
  if (!text || !state.result) return;
  if (state.usage.remaining <= 0) { showScreen('limit'); return; }
  showScreen('generating');
  try {
    const res = await api('/api/modify', { userId: state.user?.id, generatedUrl: state.result.generatedUrl, modificationText: text });
    state.result.generatedUrl = res.generatedUrl;
    state.usage = res.usage;
    showScreen('result');
  } catch (err) {
    if (err.error === 'limit_reached') { state.usage = err.usage || state.usage; showScreen('limit'); }
    else { state.errorMessage = err.message || err.error || 'Modification failed'; state.lastAction = applyModification; showScreen('error'); }
  }
}

// ── Comparison slider ────────────────────────
function initSlider() {
  const c = document.getElementById('comparison');
  const s = document.getElementById('comp-slider');
  const b = document.getElementById('comp-before');
  if (!c || !s || !b) return;
  let drag = false;
  function upd(x) {
    const rect = c.getBoundingClientRect();
    let pct = Math.max(2, Math.min(98, ((x - rect.left) / rect.width) * 100));
    s.style.left = pct + '%';
    b.style.clipPath = `inset(0 ${100 - pct}% 0 0)`;
  }
  s.addEventListener('mousedown', e => { drag = true; e.preventDefault(); });
  s.addEventListener('touchstart', () => { drag = true; }, { passive: true });
  document.addEventListener('mousemove', e => { if (drag) upd(e.clientX); });
  document.addEventListener('touchmove', e => { if (drag) upd(e.touches[0].clientX); }, { passive: true });
  document.addEventListener('mouseup', () => drag = false);
  document.addEventListener('touchend', () => drag = false);
  c.addEventListener('click', e => upd(e.clientX));
}

// ── Toast ────────────────────────────────────
function toast(msg, isErr) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (isErr ? ' error' : '');
  setTimeout(() => el.className = 'toast', 3000);
}

// ── Telegram theme ───────────────────────────
if (tg) {
  tg.expand();
  tg.enableClosingConfirmation();
  if (tg.colorScheme === 'light') {
    const r = document.documentElement.style;
    r.setProperty('--bg', '#ffffff');
    r.setProperty('--bg2', '#f5f5f7');
    r.setProperty('--surface', '#f0f0f5');
    r.setProperty('--surface2', '#e8e8f0');
    r.setProperty('--surface3', '#dddde8');
    r.setProperty('--border', '#d0d0e0');
    r.setProperty('--text', '#1a1a2e');
    r.setProperty('--text2', '#555570');
    r.setProperty('--text3', '#8888a0');
  }
  tg.BackButton.onClick(() => goBack());
}

// ── Init ─────────────────────────────────────
async function init() {
  try {
    // Send initData + initDataUnsafe.user as fallback for auth
    const authPayload = {
      initData: tg?.initData || '',
      user: tg?.initDataUnsafe?.user || null,
    };
    const data = await api('/api/auth', authPayload);
    state.user = data.user;
    state.usage = data.usage;
    if (data.user?.lang) state.lang = data.user.lang;
    else if (tg?.initDataUnsafe?.user?.language_code) {
      const lc = tg.initDataUnsafe.user.language_code;
      if (['ru', 'uz'].includes(lc)) state.lang = lc;
    }
    if (data.user?.onboarded && data.user?.lang) {
      if (data.user.prefs) state.prefs = { ...state.prefs, ...data.user.prefs };
      showScreen('upload');
      return;
    }
  } catch (err) {
    console.error('Init failed:', err);
    // Still extract name from Telegram if available
    if (tg?.initDataUnsafe?.user) {
      const u = tg.initDataUnsafe.user;
      state.user = { id: u.id, firstName: u.first_name || '', lastName: u.last_name || '' };
    }
  }
  showScreen('language');
}

// Safety: if init takes too long, force show language screen
const initTimeout = setTimeout(() => {
  if (state.currentScreen === 'splash') showScreen('language');
}, 5000);

setTimeout(() => { init().finally(() => clearTimeout(initTimeout)); }, 800);
</script>
